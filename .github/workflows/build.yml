name: Build WireShark
on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Kernel source branch
        type: choice
        options: [cnb-optimized, cnb]
        default: cnb-optimized
        required: true
  push:
    branches: [main]
    paths: ['scripts/**', 'anykernel.sh', '.github/workflows/build.yml']
permissions:
  contents: read
concurrency:
  group: wireshark-${{ github.ref }}-${{ inputs.kernel_ref || 'cnb-optimized' }}
  cancel-in-progress: true
jobs:
  import-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create local kernel source branches if absent
        run: bash scripts/import-source.sh
  build:
    needs: import-source
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h "$GITHUB_WORKSPACE"
      - name: Add linker swap space
        run: |
          sudo fallocate -l 12G /mnt/wireshark-swap
          sudo chmod 600 /mnt/wireshark-swap
          sudo mkswap /mnt/wireshark-swap
          sudo swapon /mnt/wireshark-swap
          free -h
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev lz4 zip unzip rsync python3 python-is-python3 curl git build-essential libncurses-dev gcc-aarch64-linux-gnu
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Validate module ABI preflight
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror scripts/module_check.c -o "$RUNNER_TEMP/module-check-host"
          python3 scripts/test_module_check.py "$RUNNER_TEMP/module-check-host"
      - name: Build and validate flashable ZIP
        env:
          KERNEL_REF: ${{ inputs.kernel_ref || 'cnb-optimized' }}
        run: bash scripts/build.sh
      - name: Upload flashable ZIP and provenance
        uses: actions/upload-artifact@v4
        with:
          name: WireShark-coral
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.txt
            dist/*.xml
            dist/kernel.config
            dist/matching-modules.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WireShark-build-log
          path: dist/build.log
          if-no-files-found: ignore
          retention-days: 14

